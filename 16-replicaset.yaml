kind: ReplicaSet
apiVersion: apps/v1
metadata:
  name: replicaset
  labels:
    app: nginx
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
      app: nginx
  template:
    metadata:
      labels:
        tier: frontend
        app: nginx
        project: misumi
    spec:
      containers:
      - name: nginx
        image: nginx
        